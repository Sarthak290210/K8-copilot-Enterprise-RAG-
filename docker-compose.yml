# Local stack: Postgres + Qdrant + the API.
#   docker compose up -d --build                         # start everything
#   docker compose run --rm api python scripts/seed_db.py  # seed tables + demo users
#   docker compose up -d postgres qdrant                 # only the databases (for `make api`)
#
# Upstash Redis, Groq, Tavily, Voyage are cloud services, configured via .env.
# Compose reads .env for ${...} substitution; POSTGRES_PASSWORD must match DATABASE_URL.

name: k8-copilot

services:
  postgres:
    image: postgres:17.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: adv_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adv_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp checks the port is accepting connections.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network, services are reached by name, not localhost.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/adv_rag
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      # Cache downloaded embedding / reranker models across container restarts.
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  pgdata:
  qdrant_data:
  hf_cache:
