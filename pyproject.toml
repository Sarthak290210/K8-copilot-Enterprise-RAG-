[project]
name = "k8-copilot"
version = "0.1.0"
description = "Advanced RAG: Text2SQL + Core RAG + Caching + LLM Security"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Settings & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # LLM
    "tiktoken>=0.8.0",
    # Vector DB & embeddings
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.0",
    # Direct dep so [tool.uv.sources] below can pin it to the CPU-only build on Linux.
    "torch>=2.4.0",
    "torchvision",  # used by docling; must come from the same CPU index as torch
    # Doc parsing
    "docling>=2.9.0",
    # Postgres
    "psycopg[binary,pool]>=3.2.0",
    # Cache
    "upstash-redis>=1.2.0",
    # Auth
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    # Logging
    "loguru>=0.7.2",
    # Agent orchestration
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    # === Phase 2+ deps pinned now to avoid churn ===
    "voyageai>=0.3.0",
    "tavily-python>=0.5.0",
    # === Phase 4 deps ===
    "llm-guard>=0.3.15",
    "boto3>=1.35.0",
    "pypdf>=5.1.0",
    # === Data pipeline deps ===
    "pyyaml>=6.0",   # config.yaml parsing in scripts/data_pipeline/
    "faker>=33.0.0", # synthetic K8s ops SQL generation
    "openai>=1.60.0",
    "rank-bm25>=0.2.2",
    "sqlglot>=26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ragas>=0.4.3",  # eval/ragas_adapter.py (0.3.x fails to import)
    "reportlab>=4.2.0",  # PDF generation in scripts/data_pipeline/05_diversify_true_formats.py
    "python-docx>=1.1.0",  # DOCX generation in scripts/data_pipeline/05_diversify_true_formats.py
    "streamlit>=1.40.0",
    # Ragas judge LLM (Groq)
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.
    "langchain-community<0.4",
    "langchain-openai>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ragas/langchain emit deprecation warnings on import that we can't act on.
filterwarnings = ["ignore::DeprecationWarning"]

# CPU-only PyTorch on Linux (the Docker image): the default PyPI build pulls ~15 CUDA
# packages (most of the old ~11 GB image). Windows/macOS PyPI wheels are already CPU-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
