# Golden questions: the eval "exam paper" (plan.md Phase 0).
# Rules: golden_sources are real file names in seed/docs/true_data (or the special sources
# `query_results` for SQL and `tavily_web` for web fallback). Every keyword of a doc-based
# question appears in at least one of its sources. Fixed from eval/seed_questions.yaml on
# 2026-10-22: sources renamed to real files; questions about topics absent from the corpus
# (CrashLoopBackOff/ErrImagePull/OOMKilled docs, runbooks, HPA page) rewritten; SQL goldens
# made date-independent and use real cluster names; 4 security goldens added (q-041..q-044).

